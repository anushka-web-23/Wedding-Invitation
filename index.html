
<!-- 3D ROYAL WEDDING ENVELOPE -->
<div id="inviteCover">
  <div class="envelopeScene">
    <div class="royalEnvelope3D" id="royalEnvelope3D">

      <!-- Back of envelope -->
      <div class="envelopeBack"></div>

      <!-- Invitation card -->
      <div class="invitationCard">
        <div class="invitationCardInner">
          <div class="miniCrown">♛</div>
          <p class="cardLabel">THE WEDDING OF</p>
          <h1>Srashti</h1>
          <div class="cardAmp">&amp;</div>
          <h1>Tanmay</h1>
          <div class="cardGoldLine"></div>
          <p class="cardDate">30 NOVEMBER 2026</p>
        </div>
      </div>

      <!-- Envelope front -->
      <div class="envelopeFront"></div>

      <!-- Opening flap -->
      <div class="envelopeFlap3D"></div>

      <!-- Gold seal -->
      <div class="envelopeSeal">S<span>&amp;</span>T</div>

      <!-- Click button -->
      <button class="envelopeOpenBtn"
        onclick="openRoyalEnvelope()">
        OPEN INVITATION ✦
      </button>

    </div>
  </div>
</div>
