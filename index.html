<!-- =========================
     FIRST INVITATION PAGE — ROYAL ENVELOPE
========================= -->

<style>

#inviteCover{
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;
    background:#f7eadb;
    transition:opacity 1.2s ease;
}

.royalCover{
    position:relative;
    width:100%;
    height:100%;

    background-image:url("wedding-cover.png");
    background-position:center center;
    background-repeat:no-repeat;
    background-size:cover;
}

/* Floating rose petals */

.royalPetals{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.royalPetal{
    position:absolute;
    top:-35px;

    width:11px;
    height:17px;

    border-radius:100% 0 100% 0;

    background:#8f1724;

    opacity:.65;

    animation:royalFall linear infinite;
}

.royalPetal:nth-child(1){
    left:8%;
    animation-duration:9s;
    animation-delay:1s;
}

.royalPetal:nth-child(2){
    left:24%;
    animation-duration:12s;
    animation-delay:3s;
}

.royalPetal:nth-child(3){
    left:47%;
    animation-duration:10s;
    animation-delay:0s;
}

.royalPetal:nth-child(4){
    left:71%;
    animation-duration:13s;
    animation-delay:2s;
}

.royalPetal:nth-child(5){
    left:89%;
    animation-duration:11s;
    animation-delay:4s;
}

@keyframes royalFall{

    0%{
        transform:
            translate3d(0,-40px,0)
            rotate(0deg);
    }

    50%{
        transform:
            translate3d(35px,50vh,0)
            rotate(180deg);
    }

    100%{
        transform:
            translate3d(-25px,110vh,0)
            rotate(360deg);
    }

}


/* Envelope clickable area */

.envelopeClickArea{
    position:absolute;

    left:50%;
    top:47%;

    width:min(82vw,820px);
    height:min(34vw,560px);

    transform:translate(-50%,-50%);

    border:0;
    padding:0;
    margin:0;

    background:transparent;

    cursor:pointer;

    z-index:10;
}

.envelopeClickArea:focus-visible{
    outline:2px solid #8f1724;
    outline-offset:6px;
}

.envelopeClickArea::after{
    content:"";

    position:absolute;

    inset:8%;

    border-radius:8px;

    box-shadow:
        0 0 0 rgba(255,255,255,0);

    transition:
        box-shadow .45s ease;

    pointer-events:none;
}

.envelopeClickArea:hover::after{
    box-shadow:
        0 0 45px rgba(255,255,255,.16);
}


/* Opening */

#inviteCover.opening .royalCover{

    transform:scale(1.035);

    transition:
        transform 1.15s ease;
}

#inviteCover.opening{

    opacity:0;

    pointer-events:none;
}


@media(max-width:600px){

    .royalCover{
        background-position:center center;
    }

    .envelopeClickArea{

        top:50%;

        width:92vw;
        height:34vh;
    }

}

</style>


<div id="inviteCover">

    <div class="royalCover">

        <div class="royalPetals">

            <span class="royalPetal"></span>
            <span class="royalPetal"></span>
            <span class="royalPetal"></span>
            <span class="royalPetal"></span>
            <span class="royalPetal"></span>

        </div>


        <!-- Envelope par click -->

        <button
            class="envelopeClickArea"
            onclick="enterInvitation()"
            aria-label="Open Wedding Invitation">
        </button>

    </div>

</div>


<script>

function enterInvitation(){

    const cover =
        document.getElementById("inviteCover");

    cover.classList.add("opening");

    setTimeout(function(){

        cover.style.display="none";

    },1200);

}

</script>
